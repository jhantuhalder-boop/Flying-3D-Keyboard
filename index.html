<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Super 3D Flying Keyboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#304c79,#142544 65%,#080f25);color:white;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:700px;margin:auto;padding:18px 12px 30px}h1{text-align:center;font-size:clamp(24px,5vw,34px);margin:12px 0 4px}.sub{text-align:center;color:#b8c9e6;margin:0 0 22px}.screen{height:190px;border-radius:28px;background:linear-gradient(#fff,#f5f8ff);box-shadow:inset 0 7px 16px #aab7ca,0 8px 22px #07152c;color:#172744;padding:20px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:25px}.toolbar,.languages{display:flex;gap:7px;margin:15px 0}.toolbar button,.languages button{flex:1;min-width:0;background:#29456f;color:white;border:1px solid #839dc6;border-radius:14px;padding:13px 4px;font-size:15px}.languages .active{background:#69aaff;color:#071a35}.keyboard{margin-top:35px;border:3px solid #54739f;border-radius:30px;padding:10px 5px 16px;background:linear-gradient(140deg,#29446b,#101d3b);box-shadow:0 14px 28px #0008,inset 0 3px 12px #6c8bbb55}.row{display:flex;justify-content:center;gap:4px;margin:6px 0}.key{flex:1;min-width:0;height:56px;padding:0;border:1px solid #b9d3f9;border-radius:13px;color:#132644;background:linear-gradient(#fff,#e7f0ff 48%,#8caedb);box-shadow:0 5px 0 #52719d,0 7px 9px #0007;font-size:clamp(15px,3.6vw,23px);font-weight:750;touch-action:manipulation;user-select:none;-webkit-user-select:none}.key:active{transform:translateY(4px);box-shadow:0 1px 0 #52719d}.key.special{background:linear-gradient(#80c4ff,#3977ce);color:white}.key.wide{flex:3}.note{text-align:center;color:#c6d3e9;font-size:13px;margin:22px 4px}.fly{position:fixed;pointer-events:none;z-index:100;font-size:32px;font-weight:900;text-shadow:0 0 12px #fff;animation:fly .58s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.45) rotate(-12deg);opacity:0}}.spark{position:fixed;pointer-events:none;width:7px;height:7px;border-radius:50%;z-index:101;animation:burst .65s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}@media(max-width:380px){.key{height:49px}.keyboard{padding:8px 3px}.row{gap:3px}}
</style>
</head>
<body><main><h1>✨ Super 3D Flying Keyboard</h1><p class="sub">Touch • Fly • Fireworks • Type</p><div id="screen" class="screen" role="textbox" aria-label="Typed text" aria-live="polite"></div><div class="toolbar"><button id="copy">📋 Copy</button><button id="share">↗ Share</button><button id="clear">× Clear</button></div><div class="languages"><button data-lang="en" class="active">English</button><button data-lang="hi">हिंदी</button><button data-lang="bn">বাংলা</button></div><div id="keyboard" class="keyboard"></div><p class="note">यह वेबसाइट का कीबोर्ड है। Copy करके दूसरे ऐप में टेक्स्ट पेस्ट कर सकते हैं। iOS सिस्टम कीबोर्ड अलग ऐप एक्सटेंशन से बनेगा।</p></main>
<script>
'use strict';
const screen=document.getElementById('screen'),keyboard=document.getElementById('keyboard');
let value='',lang='en',shift=false,symbols=false,audio=null,lastTap={key:'',time:0};
const layouts={en:['qwertyuiop','asdfghjkl','zxcvbnm'],hi:['ौैाीूबयहगदजड','ोे्िुप रकतमचट','ंनवलसषक्षत्रज्ञ'].map(s=>s.replaceAll(' ','')),bn:['ৌৈাীূবযহগদজড','োে্িুপরকতমচট','ংনবলসশষড়ঢ়']};
const numbers=['1234567890','@#$%&-+()/','*"\':;!?.,'];
function tone(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.setValueAtTime(660,t);o.frequency.exponentialRampToValueAtTime(990,t+.085);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.17)}catch(e){}}
function draw(){keyboard.replaceChildren();const rows=symbols?numbers:layouts[lang];rows.forEach((letters,i)=>{const row=document.createElement('div');row.className='row';if(i===2)row.appendChild(makeKey('⇧','shift',true));Array.from(letters).forEach(ch=>row.appendChild(makeKey(shift&&lang==='en'?ch.toUpperCase():ch,'char')));if(i===2)row.appendChild(makeKey('⌫','back',true));keyboard.appendChild(row)});const bottom=document.createElement('div');bottom.className='row';[['123','numbers'],['🌐','language'],['space','space'],['.','char'],['↵','enter']].forEach(([label,action])=>bottom.appendChild(makeKey(label,action,true,label==='space')));keyboard.appendChild(bottom)}
function makeKey(label,action,special=false,wide=false){const b=document.createElement('button');b.type='button';b.className='key'+(special?' special':'')+(wide?' wide':'');b.textContent=label;b.addEventListener('click',()=>press(label,action,b));return b}
function burst(x,y){const colors=['#ffdf5a','#ff6b9c','#66e4ff','#b99cff','#9dff9a'];for(let i=0;i<9;i++){const s=document.createElement('span');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';s.style.background=colors[i%colors.length];const a=i*Math.PI*2/9;s.style.setProperty('--x',Math.cos(a)*46+'px');s.style.setProperty('--y',Math.sin(a)*46+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}
function animate(label,button){const r=button.getBoundingClientRect(),s=screen.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;const el=document.createElement('span');el.className='fly';el.textContent=label;el.style.left=x+'px';el.style.top=y+'px';el.style.color=['#fff','#ffeb83','#a8eeff'][Math.floor(Math.random()*3)];el.style.setProperty('--dx',s.left+s.width/2-x+'px');el.style.setProperty('--dy',s.top+s.height/2-y+'px');document.body.appendChild(el);burst(x,y);setTimeout(()=>el.remove(),650)}
function press(label,action,button){tone();if(action==='shift'){shift=!shift;draw();return}if(action==='numbers'){symbols=!symbols;draw();return}if(action==='language'){lang=lang==='en'?'hi':lang==='hi'?'bn':'en';symbols=false;shift=false;syncLang();draw();return}if(action==='back'){value=Array.from(value).slice(0,-1).join('')}else{let char=action==='space'?' ':action==='enter'?'\n':label;if(action==='char'&&lang==='en'&&!symbols){const now=Date.now();if(lastTap.key===label.toLowerCase()&&now-lastTap.time<330&&value.endsWith(label.toLowerCase())){value=value.slice(0,-1)+label.toUpperCase();lastTap={key:'',time:0};animate(label.toUpperCase(),button);screen.textContent=value;return}lastTap={key:label.toLowerCase(),time:now}}else lastTap={key:'',time:0};value+=char;animate(char===' '?'␣':char,button)}screen.textContent=value;screen.scrollTop=screen.scrollHeight}
function syncLang(){document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;shift=false;symbols=false;syncLang();draw()}));
document.getElementById('clear').onclick=()=>{value='';screen.textContent='';tone()};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(value);alert('Copied!')}catch(e){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Copied!')}};
document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({text:value})}catch(e){}}else document.getElementById('copy').click()};
draw();
</script></body></html>
