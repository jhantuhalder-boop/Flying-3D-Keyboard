<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#172b51"><title>Super 3D Flying Keyboard</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(155deg,#355b93,#16294b 55%,#080f2b);color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:18px 12px 35px}h1{text-align:center;font-size:clamp(23px,5vw,35px);margin:12px 0 3px}.sub{text-align:center;color:#c4d8fb;margin:0 0 18px}.screen{min-height:170px;background:linear-gradient(#fff,#edf3ff);border:4px solid #c5d6f3;box-shadow:inset 0 5px 18px #9aabc6,0 8px 20px #08142b;border-radius:25px;padding:17px;color:#152846;font-size:clamp(25px,5vw,35px);line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap;outline:none;caret-color:#2768db}.toolbar,.langs,.settings{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.toolbar button,.langs button,.settings button,.settings select{flex:1;min-width:75px;background:#2b4c7d;border:1px solid #9dbce9;border-radius:13px;color:white;padding:12px 6px;font-size:15px}.langs button.active,.settings button.active{background:#69aaff;color:#0c2342}.settings{align-items:center}.settings label{font-size:13px;display:flex;align-items:center;gap:5px;background:#223d67;padding:8px;border-radius:10px}.settings input[type=color]{width:38px;height:32px;border:0;background:none}.keyboard{border:3px solid #6d92c9;border-radius:29px;padding:12px 5px 16px;background:linear-gradient(145deg,#365984,#182a4e);box-shadow:inset 0 4px 9px #88a8d666,0 13px 23px #050b20}.row{display:flex;justify-content:center;gap:4px;margin:7px 0}.key{position:relative;flex:1;min-width:0;height:clamp(58px,11vw,77px);padding:0 1px;border-radius:13px;border:1px solid #a5bde3;background:linear-gradient(180deg,#fff 0%,#dce9ff 45%,#91b5eb 90%);box-shadow:0 6px 0 #5276a9,0 9px 8px #07152d;color:#152849;font-weight:800;font-size:clamp(19px,4.4vw,29px);text-shadow:0 1px #fff;touch-action:manipulation;transition:transform .1s,filter .1s}.key:active,.key.flash{transform:translateY(5px) scale(1.09);filter:brightness(1.45) drop-shadow(0 0 14px #f8e28e);box-shadow:0 1px 0 #5276a9,0 0 23px #b6dcff}.key.special{background:linear-gradient(#87d4ff,#4381d4);color:white;text-shadow:0 1px #244e8b}.key.wide{flex:4}.key.mid{flex:1.5}.note{text-align:center;color:#c4d5ed;font-size:12px;margin:18px 5px}.fly{position:fixed;z-index:99;pointer-events:none;font-weight:1000;font-size:clamp(70px,22vw,160px);color:#fff5a2;text-shadow:0 0 10px #fff,0 0 25px #58caff,0 0 45px #e7a0ff;transform:translate(-50%,-50%);animation:fly 1.05s cubic-bezier(.17,.6,.35,1) forwards;white-space:nowrap}@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) scale(.6) rotate(-9deg)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(5deg)}75%{opacity:1}100%{left:var(--tx);top:var(--ty);opacity:0;transform:translate(-50%,-50%) scale(.24)}}.spark{position:fixed;pointer-events:none;z-index:100;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);animation:spark .75s ease-out forwards}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}.status{font-size:12px;color:#c8e1ff;text-align:center;min-height:18px}button{cursor:pointer}@media(max-width:390px){main{padding:10px 5px}.keyboard{padding:9px 3px}.row{gap:3px}.key{border-radius:9px;font-size:clamp(17px,5vw,23px)}.toolbar button{font-size:13px}}
</style></head><body><main><h1>✨ Super 3D Flying Keyboard</h1><p class="sub">Touch • Fly • Glow • Speak • Type</p><div id="screen" class="screen" contenteditable="true" role="textbox" aria-label="Typing area" spellcheck="false"></div><div class="toolbar"><button id="copy">📋 Copy</button><button id="share">↗ Share</button><button id="clear">× Clear</button></div><div class="langs"><button data-lang="en" class="active">English</button><button data-lang="hi">हिंदी</button><button data-lang="bn">বাংলা</button></div><div class="settings"><label>Text Color <input id="color" type="color" value="#203b70"></label><label><input type="checkbox" id="rainbow"> Rainbow</label><label><input type="checkbox" id="letterVoice" checked> Letter Voice</label><label><input type="checkbox" id="wordVoice" checked> Word Voice</label><label><input type="checkbox" id="sound" checked> Sweet Sound</label></div><div class="settings"><label style="flex:1">Custom pronunciation <input id="alias" style="width:100%;max-width:180px" placeholder="jhantu=झंटू" aria-label="Custom pronunciation"></label><button id="saveAlias">Save name</button></div><div class="status" id="status">Tap a key. Space speaks the completed word.</div><div class="keyboard" id="keyboard"></div><p class="note">यह वेबसाइट वाला कीबोर्ड है। iPhone के WhatsApp या Safari का सिस्टम कीबोर्ड बनने के लिए अलग iOS Keyboard Extension बनाना होगा। आवाज़ iPhone की उपलब्ध speech voices पर निर्भर है।</p></main>
<script>
(()=>{'use strict';
const screen=document.getElementById('screen'),keyboard=document.getElementById('keyboard'),status=document.getElementById('status');let lang='en',shift=false,caps=false,numbers=false,voiceReady=false;let text='',lastWord='',speakTimer=0;const aliasMap={jhantu:'झंटू',ghtu:'झंटू'};
try{Object.assign(aliasMap,JSON.parse(localStorage.getItem('pronunciations')||'{}'))}catch{}
const layouts={en:['qwertyuiop','asdfghjkl','zxcvbnm'],hi:[['ौ','ै','ा','ी','ू','ब','ह','ग','द','ज'],['ो','े','्','ि','ु','प','र','क','त','च'],['ट','झ','न','म','व','ल','स','य','ष']],bn:[['ৌ','ৈ','া','ী','ূ','ব','হ','গ','দ','জ'],['ো','ে','্','ি','ু','প','র','ক','ত','চ'],['ট','ঝ','ন','ম','ভ','ল','স','য','ষ']]};
const numRows=[['1','2','3','4','5','6','7','8','9','0'],['@','#','₹','%','&','-','+','(',')','/'],['*','"',"'",':',';','!','?','.',',']];
const voiceLang=()=>({en:'en-IN',hi:'hi-IN',bn:'bn-IN'})[lang];
function speak(value,isWord=false){if(!value||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(value);u.lang=isWord&&/[\u0900-\u097f]/.test(value)?'hi-IN':isWord&&/[\u0980-\u09ff]/.test(value)?'bn-IN':voiceLang();u.rate=isWord?.78:.85;u.pitch=1.12;u.volume=.95;const voices=speechSynthesis.getVoices();const matching=voices.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));if(matching)u.voice=matching;speechSynthesis.speak(u)}catch(e){status.textContent='Voice unavailable on this browser'}}
let audio;function chime(){if(!document.getElementById('sound').checked)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime;[640,920].forEach((freq,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t+i*.06);g.gain.setValueAtTime(.0001,t+i*.06);g.gain.exponentialRampToValueAtTime(.055,t+i*.06+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.06+.22);o.connect(g);g.connect(audio.destination);o.start(t+i*.06);o.stop(t+i*.06+.23)})}catch{}}
function fly(label,button){if(!button)return;const r=button.getBoundingClientRect(),s=screen.getBoundingClientRect(),el=document.createElement('div');el.className='fly';el.textContent=label;el.style.left=r.left+r.width/2+'px';el.style.top=r.top+r.height/2+'px';el.style.setProperty('--tx',Math.min(s.right-24,s.left+Math.max(35,s.width*.5))+'px');el.style.setProperty('--ty',s.top+Math.min(70,s.height/2)+'px');document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});for(let i=0;i<9;i++){const p=document.createElement('i');p.className='spark';p.style.left=r.left+r.width/2+'px';p.style.top=r.top+r.height/2+'px';p.style.setProperty('--c',['#ffe080','#6defff','#ffa5e4'][i%3]);p.style.setProperty('--dx',(Math.cos(i*2*Math.PI/9)*65)+'px');p.style.setProperty('--dy',(Math.sin(i*2*Math.PI/9)*65)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),800)}}
function paint(){screen.innerHTML='';const rainbow=document.getElementById('rainbow').checked;const color=document.getElementById('color').value;Array.from(text).forEach((ch,i)=>{if(ch==='\n'){screen.appendChild(document.createElement('br'));return}const span=document.createElement('span');span.textContent=ch;span.style.color=rainbow?`hsl(${(i*47)%360} 83% 38%)`:color;screen.appendChild(span)});screen.scrollTop=screen.scrollHeight}
function completedWord(){const match=text.match(/([^\s]+)$/u);if(!match)return;const raw=match[1],word=aliasMap[raw.toLowerCase()]||raw;lastWord=word;if(document.getElementById('wordVoice').checked)speak(word,true);status.textContent='Word: '+word}
function add(ch,b){if(ch===' '||ch==='\n')completedWord();text+=ch;paint();if(ch.trim()){chime();fly(ch,b);if(document.getElementById('letterVoice').checked){clearTimeout(speakTimer);speakTimer=setTimeout(()=>speak(ch),80)}}if(shift&&!caps){shift=false;render()}}
function key(label,fn,cls=''){const b=document.createElement('button');b.type='button';b.className='key '+cls;b.textContent=label;b.addEventListener('click',()=>{b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),190);fn(b)});return b}
function render(){keyboard.innerHTML='';const rows=numbers?numRows:layouts[lang];rows.forEach((row,i)=>{const div=document.createElement('div');div.className='row';if(i===2)div.appendChild(key(shift||caps?'⇧ ON':'⇧',()=>{if(shift){caps=true;shift=false}else if(caps){caps=false;shift=false}else shift=true;render()},'special mid'));Array.from(row).forEach(ch=>div.appendChild(key(lang==='en'&&!numbers&&(shift||caps)?ch.toUpperCase():ch,b=>add(lang==='en'&&!numbers&&(shift||caps)?ch.toUpperCase():ch,b))));if(i===2)div.appendChild(key('⌫',()=>{text=Array.from(text).slice(0,-1).join('');paint();chime()},'special mid'));keyboard.appendChild(div)});const bottom=document.createElement('div');bottom.className='row';bottom.appendChild(key(numbers?'ABC':'123',()=>{numbers=!numbers;render()},'special mid'));bottom.appendChild(key('🌐',()=>{lang=lang==='en'?'hi':lang==='hi'?'bn':'en';numbers=false;shift=false;caps=false;updateLang()},'special mid'));bottom.appendChild(key('space',b=>add(' ',b),'wide'));bottom.appendChild(key('.',b=>add('.',b),'special'));bottom.appendChild(key('↵',b=>add('\n',b),'special mid'));keyboard.appendChild(bottom)}
function updateLang(){document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));render()}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;numbers=false;shift=false;caps=false;updateLang()});
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text);status.textContent='Copied!'}catch{status.textContent='Select text and use Copy'}};
document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({text})}catch{}}else{try{await navigator.clipboard.writeText(text);status.textContent='Copied for sharing'}catch{}}};
document.getElementById('clear').onclick=()=>{text='';paint();status.textContent='Cleared'};
document.getElementById('color').oninput=paint;document.getElementById('rainbow').onchange=paint;
document.getElementById('saveAlias').onclick=()=>{const raw=document.getElementById('alias').value.trim();const idx=raw.indexOf('=');if(idx<1||idx===raw.length-1){status.textContent='Write: jhantu=झंटू';return}aliasMap[raw.slice(0,idx).trim().toLowerCase()]=raw.slice(idx+1).trim();try{localStorage.setItem('pronunciations',JSON.stringify(aliasMap))}catch{}status.textContent='Pronunciation saved'};
// Allow paste and physical typing without breaking on-screen controls.
screen.addEventListener('input',()=>{text=screen.innerText.replace(/\n$/,'');paint()});
updateLang();paint();
})();
</script></body></html>
