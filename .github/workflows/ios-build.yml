name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iOS App
        run: |
          xcodebuild \
            -project Flying3DKeyboard.xcodeproj \
            -scheme Flying3DKeyboard \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: Flying3DKeyboard-Unsigned
          path: build/Build/Products/Debug-iphoneos/*.app
          if-no-files-found: error
