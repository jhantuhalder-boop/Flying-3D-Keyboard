name: Flying3DKeyboard
options:
  bundleIdPrefix: com.flying3dkeyboard.personal
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  Flying3DKeyboard:
    type: application
    platform: iOS
    sources: [iOSApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flying3dkeyboard.personal.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: Flying3DKeyboardExtension
        embed: true
  Flying3DKeyboardExtension:
    type: app-extension
    platform: iOS
    sources: [iOSKeyboard]
    info:
      path: iOSKeyboard/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flying3dkeyboard.personal.app.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
